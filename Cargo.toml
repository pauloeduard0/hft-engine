[package]
name = "hft-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
crossterm = "0.27"
reqwest = { version = "0.12", features = ["json", "native-tls"], default-features = false }
